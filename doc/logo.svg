<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c6ef5"/>
      <stop offset="1" stop-color="#7048e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1b1f3a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>

  <!-- shared document -->
  <rect x="44" y="40" width="168" height="176" rx="20" fill="#ffffff" filter="url(#shadow)"/>

  <!-- text lines -->
  <g fill="#c5cbe3">
    <rect x="68" y="74" width="120" height="14" rx="7"/>
    <rect x="68" y="108" width="66" height="14" rx="7"/>
    <rect x="68" y="142" width="104" height="14" rx="7"/>
    <rect x="68" y="176" width="52" height="14" rx="7"/>
  </g>

  <!-- user A (orange): selection + caret with name flag -->
  <rect x="68" y="103" width="66" height="24" rx="5" fill="#fd7e14" opacity="0.28"/>
  <rect x="134" y="100" width="7" height="30" rx="3.5" fill="#fd7e14"/>
  <rect x="134" y="90" width="34" height="13" rx="4" fill="#fd7e14"/>

  <!-- user B (teal): caret with name flag -->
  <rect x="120" y="168" width="7" height="30" rx="3.5" fill="#12b886"/>
  <rect x="120" y="158" width="34" height="13" rx="4" fill="#12b886"/>
</svg>
